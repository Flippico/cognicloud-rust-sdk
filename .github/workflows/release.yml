name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish the version in Cargo.toml if crates.io does not have it
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; nothing published."
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          code=$(curl -s -A "cognicloud-release" -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/cognicloud-sdk/$version")
          if [ "$code" = "200" ]; then
            echo "cognicloud-sdk $version is already on crates.io."
            exit 0
          fi
          cargo test --locked
          cargo publish --locked
          git tag "v$version"
          git push origin "v$version"
