[package]
name = "cognicloud-sdk"
version = "0.14.0"
edition = "2021"
description = "CogniCloud SDK: call AI Gateway endpoints and manage them."
license-file = "LICENSE"
repository = "https://github.com/Flippico/cognicloud-rust-sdk"
readme = "README.md"
rust-version = "1.75"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
